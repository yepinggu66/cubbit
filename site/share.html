<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>方块仔 · 人生账本</title>
    <meta name="description" content="一天一步，四十步走完一辈子。看看别人走过的这一步。" />
    <meta property="og:title" content="方块仔 · 人生账本" />
    <meta property="og:description" content="一天一步，四十步走完一辈子。" />
    <meta property="og:type" content="article" />
    <style>
      :root {
        --bg: #0b0d13;
        --line: rgba(255,255,255,.09);
        --text: #eef1f8;
        --text-2: #a6aebf;
        --text-3: #6d768a;
        --accent: #ffb469;
        --accent-2: #ff8f6b;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        background:
          radial-gradient(900px 420px at 50% -10%, rgba(255,176,110,.14), transparent 62%),
          radial-gradient(700px 380px at 92% 108%, rgba(120,148,255,.10), transparent 60%),
          var(--bg);
        color: var(--text);
        font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { max-width: 760px; margin: 0 auto; padding: 40px 20px 56px; }
      .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; }
      .dot { width: 11px; height: 11px; border-radius: 50%; background: linear-gradient(160deg, var(--accent), var(--accent-2)); box-shadow: 0 0 0 4px rgba(255,170,110,.14); }
      .brand b { font-size: 14px; letter-spacing: .4px; }
      .brand span { font-size: 11.5px; color: var(--text-3); }

      .card {
        border: 1px solid var(--line); border-radius: 18px;
        background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
        padding: 30px 28px 26px; position: relative; overflow: hidden;
      }
      .card::before {
        content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
        background: linear-gradient(180deg, var(--accent), var(--accent-2));
      }
      .kicker { font-size: 12px; color: var(--text-3); letter-spacing: .6px; }
      h1 { margin: 12px 0 0; font-size: 30px; line-height: 1.5; font-weight: 700; letter-spacing: .2px; }
      .plain { margin: 16px 0 0; font-size: 15.5px; line-height: 2; color: var(--text-2); white-space: pre-wrap; }
      .items { margin: 18px 0 0; padding: 0; list-style: none; counter-reset: i; }
      .items li {
        counter-increment: i; position: relative; padding: 11px 0 11px 34px;
        border-top: 1px solid var(--line); font-size: 14.5px; line-height: 1.85; color: var(--text);
      }
      .items li::before {
        content: counter(i); position: absolute; left: 0; top: 12px;
        width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
        font-size: 11px; color: #201207; background: linear-gradient(160deg, var(--accent), var(--accent-2));
      }
      .ev { display: inline-block; margin-left: 8px; font-size: 10px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--text-3); vertical-align: middle; }
      .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
      .stat { border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-align: center; background: rgba(0,0,0,.2); }
      .stat span { display: block; font-size: 11px; color: var(--text-3); }
      .stat b { display: block; margin-top: 5px; font-size: 18px; font-variant-numeric: tabular-nums; }

      .acts { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 22px; }
      .btn {
        appearance: none; border: 1px solid var(--line); border-radius: 10px;
        background: rgba(255,255,255,.04); color: var(--text); font: inherit; font-size: 13px;
        padding: 10px 15px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
      }
      .btn:hover { background: rgba(255,255,255,.08); }
      .btn--primary {
        border-color: rgba(255,176,110,.5); color: #201207; font-weight: 700;
        background: linear-gradient(180deg, rgba(255,178,112,.95), rgba(255,143,107,.9));
      }
      .foot { margin-top: 26px; font-size: 11.5px; line-height: 1.9; color: var(--text-3); }
      .foot a { color: var(--text-2); }
      .empty { text-align: center; padding: 60px 0; color: var(--text-3); font-size: 14px; line-height: 2; }
      @media (max-width: 520px) {
        .wrap { padding: 24px 14px 40px; }
        h1 { font-size: 23px; }
        .card { padding: 22px 18px 20px; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">
        <span class="dot"></span>
        <b>方块仔 · 人生账本</b>
        <span>一天一步，四十步走完一辈子</span>
      </div>
      <div id="app"><div class="empty">正在打开这张卡……</div></div>
      <p class="foot">
        内容来自《高性价比人生指南》(CC BY 4.0)，游戏化换算不构成医疗、法律或投资建议。<br />
        这张页面完全在你的浏览器里渲染：链接里带的是内容本身，不是服务器上的副本。
      </p>
    </div>

    <script>
      (function () {
        var VERSION = 1;

        function fromBase64Url(s) {
          var raw = String(s || '').replace(/-/g, '+').replace(/_/g, '/');
          var pad = raw.length % 4 ? '='.repeat(4 - (raw.length % 4)) : '';
          var bin = atob(raw + pad);
          var bytes = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          return new TextDecoder().decode(bytes);
        }

        function decode(code) {
          try {
            var o = JSON.parse(fromBase64Url(code));
            if (!o || o.v !== VERSION) return null;
            return o;
          } catch (e) {
            return null;
          }
        }

        function el(tag, cls, text) {
          var n = document.createElement(tag);
          if (cls) n.className = cls;
          if (text != null) n.textContent = text;
          return n;
        }

        var app = document.getElementById('app');
        var raw = location.hash.replace(/^#/, '');
        var code = '';
        if (raw.indexOf('d=') === 0) code = raw.slice(2);
        else if (/^[A-Za-z0-9_-]+$/.test(raw) && raw.length > 8) code = raw;

        var data = code ? decode(decodeURIComponent(code)) : null;
        if (!data) {
          app.innerHTML = '';
          var box = el('div', 'empty');
          box.innerHTML = '这张分享卡没有内容，或者链接被截断了。<br />回桌面问方块仔要一张新的吧。';
          app.appendChild(box);
          return;
        }

        var pageUrl = location.href;
        var text = '';
        var card = el('div', 'card');

        if (data.k === 'list') {
          card.appendChild(el('div', 'kicker', (data.i || []).length + ' 条 · 附证据等级'));
          card.appendChild(el('h1', null, data.t || '一份清单'));
          var ul = el('ul', 'items');
          (data.i || []).forEach(function (it) {
            var li = el('li', null, it.t || '');
            if (it.e) li.appendChild(el('span', 'ev', '证据 ' + it.e));
            ul.appendChild(li);
          });
          card.appendChild(ul);
          text = (data.t || '一份清单') + '（' + (data.i || []).length + ' 条）—— 来自方块仔 · 人生账本';
        } else if (data.k === 'ending') {
          card.appendChild(el('div', 'kicker', '四十步走完一辈子'));
          card.appendChild(el('h1', null, '我的结局：' + (data.t || '')));
          card.appendChild(el('p', 'plain', data.m || ''));
          var stats = el('div', 'stats');
          [
            ['活到', data.a ? data.a + ' 岁' : '—'],
            ['最后手里', data.c != null ? (data.c / 10000).toFixed(1) + ' 万' : '—'],
            ['真正执行', data.d != null ? data.d + ' 条' : '—']
          ].forEach(function (pair) {
            var s = el('div', 'stat');
            s.appendChild(el('span', null, pair[0]));
            s.appendChild(el('b', null, pair[1]));
            stats.appendChild(s);
          });
          card.appendChild(stats);
          text = '我用四十步走完了一辈子，结局是「' + (data.t || '') + '」。';
        } else {
          card.appendChild(el('div', 'kicker', (data.s ? data.s + ' · ' : '') + (data.e ? '证据 ' + data.e + ' 级' : '人生账本')));
          card.appendChild(el('h1', null, data.t || '一张卡'));
          card.appendChild(el('p', 'plain', data.p || ''));
          text = '「' + (data.t || '') + '」—— 来自方块仔 · 人生账本';
        }

        var acts = el('div', 'acts');
        function shareBtn(label, href) {
          var a = el('a', 'btn', label);
          a.href = href;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          return a;
        }
        acts.appendChild(shareBtn('分享到 X', 'https://x.com/intent/post?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(pageUrl)));
        acts.appendChild(shareBtn('分享到 Facebook', 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(pageUrl) + '&quote=' + encodeURIComponent(text)));
        acts.appendChild(shareBtn('分享到微博', 'https://service.weibo.com/share/share.php?title=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(pageUrl)));
        var copy = el('button', 'btn', '复制链接');
        copy.addEventListener('click', function () {
          navigator.clipboard.writeText(pageUrl).then(function () {
            copy.textContent = '已复制';
          });
        });
        acts.appendChild(copy);

        var play = el('a', 'btn btn--primary', '我也去走一局');
        play.href = './index.html';
        acts.appendChild(play);

        card.appendChild(acts);
        app.innerHTML = '';
        app.appendChild(card);

        document.title = (data.t ? data.t + ' · ' : '') + '方块仔 · 人生账本';
      })();
    </script>
  </body>
</html>
