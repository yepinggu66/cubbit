<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0e14" />
    <title>方块仔 · 手机伴侣</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
      :root {
        --bg: #0c0e14; --panel: #161923; --line: #262b38; --text: #f3eef2; --dim: #a9a2b0;
        --pink: #f0708a; --orange: #ff8a50;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; height: 100%; }
      body {
        background: radial-gradient(420px 320px at 50% -6%, #3a2030 0%, transparent 62%), var(--bg);
        color: var(--text);
        font: 15px/1.6 "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
        display: flex; flex-direction: column;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      header { display: flex; align-items: center; gap: 10px; padding: 12px 18px 6px; }
      .logo { width: 28px; height: 28px; border-radius: 9px; background: linear-gradient(155deg,#ffd0a8,#f08a5d 56%,#b4532f); box-shadow: inset 0 2px 0 rgba(255,255,255,.5), 0 6px 16px rgba(240,138,93,.35); position: relative; }
      .logo::before, .logo::after { content: ""; position: absolute; top: 10px; width: 5px; height: 6px; border-radius: 50%; background: #2a160e; }
      .logo::before { left: 7px; } .logo::after { right: 7px; }
      .brand { font-weight: 800; font-size: 15px; }
      .brand span { color: var(--dim); font-weight: 500; font-size: 12px; margin-left: 6px; }
      .spacer { flex: 1; }
      .pill { font-size: 12px; color: #ffd9c8; background: #2a1d1a; border: 1px solid #4a2f26; padding: 4px 9px; border-radius: 999px; }

      main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
      .pad { padding: 0 18px 18px; }

      /* 桌面上的那只小人搬到了手机上 */
      .petstage { display: grid; place-items: center; padding: 10px 0 4px; position: relative; }
      .pet { width: 96px; height: 100px; border-radius: 30% 30% 27% 27%; position: relative;
        background: linear-gradient(154deg, #ffd0a8 0%, #f08a5d 46%, #b4532f 100%);
        box-shadow: inset 0 -14px 22px rgba(0,0,0,.26), inset 0 10px 18px rgba(255,255,255,.42), 0 14px 30px rgba(240,138,93,.28);
        animation: bob 3.4s ease-in-out infinite; transform-origin: 50% 90%; }
      .pet .eye { position: absolute; top: 38px; width: 11px; height: 14px; border-radius: 50%; background: #2a160e; animation: blink 4.6s infinite; }
      .pet .eye.l { left: 24px; } .pet .eye.r { right: 24px; }
      .pet .blush { position: absolute; top: 56px; width: 16px; height: 8px; border-radius: 50%; background: rgba(255,120,120,.55); filter: blur(1px); }
      .pet .blush.l { left: 12px; } .pet .blush.r { right: 12px; }
      .pet .mouth { position: absolute; left: 50%; top: 58px; width: 12px; height: 7px; margin-left: -6px;
        border-radius: 0 0 12px 12px; border: 2.5px solid #2a160e; border-top: 0; }
      .pet.happy { animation: hop .6s ease-out 2; }
      .pet .fx { position: absolute; top: -6px; right: -8px; font-size: 16px; opacity: 0; transition: opacity .3s, transform .3s; }
      .pet .fx.show { opacity: 1; transform: translateY(-10px); }
      @keyframes bob { 50% { transform: translateY(-6px) scale(1.02, .98); } }
      @keyframes hop { 30% { transform: translateY(-14px) scale(.96, 1.06); } 60% { transform: translateY(0) scale(1.06, .94); } }
      @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
      .petname { color: #8d8794; font-size: 12px; margin-top: 2px; }

      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
      .card h2 { margin: 0 0 6px; font-size: 16px; }
      .card p { margin: 0 0 14px; color: var(--dim); font-size: 13.5px; }
      .btn { display: block; width: 100%; border: 0; border-radius: 13px; padding: 14px; font: 700 15px system-ui, sans-serif; color: #fff; background: linear-gradient(135deg,#ff9a6b,#f0708a); box-shadow: 0 10px 26px rgba(240,112,138,.28); }
      .btn:active { transform: scale(.985); }
      .btn.ghost { background: #232838; color: var(--text); box-shadow: none; font-weight: 600; }
      .btn:disabled { opacity: .5; }
      input.code { width: 100%; text-align: center; letter-spacing: .5em; text-transform: uppercase; font: 800 24px/1 ui-monospace, Consolas, monospace; background: #101319; color: var(--text); border: 1px solid var(--line); border-radius: 13px; padding: 15px 12px 15px 18px; margin-bottom: 12px; }
      input.code::placeholder { letter-spacing: .3em; font-size: 17px; color: #5f5a68; }
      .bigcode { display: flex; justify-content: center; gap: 8px; margin: 6px 0 14px; }
      .bigcode b { width: 44px; height: 56px; display: grid; place-items: center; border-radius: 12px; background: #101319; border: 1px solid #3a2a35; font: 800 26px/1 ui-monospace, Consolas, monospace; color: #ffe2ea; }

      .chat { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
      .who { display: flex; align-items: center; gap: 8px; padding: 2px 18px 8px; color: var(--dim); font-size: 12.5px; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: #46c98b; }
      .dot.off { background: #6b6472; }
      .list { flex: 1; overflow-y: auto; padding: 4px 18px 12px; -webkit-overflow-scrolling: touch; }
      .msg { max-width: 78%; margin: 8px 0; padding: 10px 14px; border-radius: 16px; font-size: 14.5px; word-break: break-word; }
      .msg.me { margin-left: auto; background: linear-gradient(135deg,#ff9a6b,#f0708a); color: #fff; border-bottom-right-radius: 6px; }
      .msg.they { background: #232838; border-bottom-left-radius: 6px; }
      .msg time { display: block; font-size: 10.5px; opacity: .6; margin-top: 3px; }
      .empty { color: #6f6879; text-align: center; font-size: 13.5px; margin-top: 30px; line-height: 2; }

      .gestures { display: flex; gap: 8px; overflow-x: auto; padding: 8px 14px 4px; scrollbar-width: none; }
      .gestures::-webkit-scrollbar { display: none; }
      .gestures button { flex: 0 0 auto; min-width: 58px; padding: 7px 10px; border-radius: 13px; border: 1px solid var(--line); background: #171b26; color: var(--text); font-size: 19px; line-height: 1.1; display: flex; flex-direction: column; align-items: center; gap: 2px; }
      .gestures button span { font-size: 10.5px; color: var(--dim); }
      .gestures button:active { transform: scale(.94); background: #232838; }
      .composer { display: flex; gap: 8px; padding: 10px 14px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: #0f1219; }
      .composer input { flex: 1; background: #171b26; border: 1px solid var(--line); border-radius: 13px; color: var(--text); padding: 13px 14px; font-size: 15px; }
      .composer button { width: 62px; border: 0; border-radius: 13px; font-weight: 700; color: #fff; background: linear-gradient(135deg,#ff9a6b,#f0708a); }

      .toast { position: fixed; left: 50%; bottom: 88px; transform: translateX(-50%) translateY(10px); background: #262b38; color: var(--text); border: 1px solid #3a4050; padding: 10px 16px; border-radius: 12px; font-size: 13.5px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: 80vw; text-align: center; z-index: 9; }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <header>
      <div class="logo" aria-hidden="true"></div>
      <div class="brand">方块仔<span>手机伴侣</span></div>
      <div class="spacer"></div>
      <div class="pill" id="statusPill">连接中…</div>
    </header>

    <div class="petstage">
      <div class="pet" id="pet"><span class="eye l"></span><span class="eye r"></span><span class="blush l"></span><span class="blush r"></span><span class="mouth"></span><span class="fx" id="petFx">💗</span></div>
      <div class="petname" id="petName">方块仔</div>
    </div>

    <main>
      <section id="viewPair" class="pad hidden">
        <div class="card">
          <h2>和电脑上的方块仔连起来</h2>
          <p>在电脑上右键方块仔 →「我们俩」→ 生成邀请码，填在下面。</p>
          <input class="code" id="codeInput" inputmode="text" maxlength="6" autocapitalize="characters" placeholder="6 位邀请码" />
          <button class="btn" id="joinBtn" disabled>连接</button>
        </div>
        <div class="card" style="margin-top:14px">
          <h2>或者，让电脑来连你</h2>
          <p>点下面生成一个邀请码，在电脑上输入它。</p>
          <button class="btn ghost" id="createBtn">生成邀请码</button>
          <div id="created" class="hidden" style="margin-top:14px">
            <div class="bigcode" id="bigcode"></div>
            <p id="expireText" style="text-align:center;margin:0;color:var(--dim);font-size:13px"></p>
          </div>
        </div>
      </section>
        <p id="apkHint" style="text-align:center;color:#6f6879;font-size:12.5px;margin:16px 0 0;padding:0 18px">
          想当 App 用？<a href="https://pingguye.cn/cubbit/dl/Cubbit-Android-2.0.0.apk" style="color:#ffb37a">下载安卓版 APK</a>，或者浏览器菜单「添加到主屏幕」
        </p>

      <section id="viewChat" class="chat hidden">
        <div class="who"><span class="dot" id="whoDot"></span><span id="whoText">已连接</span><span id="syncAt" style="color:#6f6879;font-size:11px;margin-left:auto"></span><button id="unpairBtn" style="background:none;border:1px solid #2c3040;color:#8d8794;border-radius:8px;padding:2px 9px;font-size:11px;margin-left:8px">重新配对</button></div>
        <div class="list" id="list"><div class="empty">还没有悄悄话<br />说一句，电脑上的方块仔会替你念出来</div></div>
        <div class="gestures" id="gestures">
          <button data-act="poke">👉<span>戳一下</span></button>
          <button data-act="heart">💗<span>比心</span></button>
          <button data-act="hug">🤗<span>抱抱</span></button>
          <button data-act="kiss">😘<span>亲亲</span></button>
          <button data-act="highfive">🙌<span>击掌</span></button>
          <button data-act="holdhands">🤝<span>牵手</span></button>
          <button data-act="goodnight">🌙<span>晚安</span></button>
        </div>
        <div style="text-align:center;padding:2px 0 0"><a href="/cubbit/m/tryon.html" style="color:#8d8794;font-size:12px;text-decoration:none">👗 试衣间（beta）</a></div>
        <div class="composer">
          <input id="msgInput" maxlength="200" placeholder="说句悄悄话…" />
          <button id="sendBtn">发送</button>
        </div>
      </section>
    </main>

    <div class="toast" id="toast"></div>

    <script>
      (function () {
        'use strict';
        const BASE = location.origin + '/cubbit/api';
        const LS = 'cubbit_mobile_v1'; // 沿用旧 key，避免已配对的手机丢状态
        const S = { token: '', refresh: '', uid: '', coupleId: '', messages: [], seen: '', busy: false, msgTimer: null, meTimer: null, lastAt: 0 };

        const $ = (id) => document.getElementById(id);
        const el = {
          pill: $('statusPill'), viewPair: $('viewPair'), viewChat: $('viewChat'),
          codeInput: $('codeInput'), joinBtn: $('joinBtn'), createBtn: $('createBtn'),
          created: $('created'), bigcode: $('bigcode'), expireText: $('expireText'),
          list: $('list'), msgInput: $('msgInput'), sendBtn: $('sendBtn'),
          whoDot: $('whoDot'), whoText: $('whoText'), syncAt: $('syncAt'), toast: $('toast'),
          pet: $('pet'), petFx: $('petFx'), petName: $('petName'),
        };

        function toast(text) {
          el.toast.textContent = text;
          el.toast.classList.add('show');
          clearTimeout(toast._t);
          toast._t = setTimeout(() => el.toast.classList.remove('show'), 2400);
        }

        function save() {
          localStorage.setItem(LS, JSON.stringify({ token: S.token, refresh: S.refresh, uid: S.uid, coupleId: S.coupleId }));
        }
        function load() {
          try {
            const cur = JSON.parse(localStorage.getItem(LS) || '{}');
            if (cur && cur.token) return cur;
            // 兼容上版（v2）存过的会话
            const old = JSON.parse(localStorage.getItem('cubbit_mobile_v2') || '{}');
            if (old && old.token) { localStorage.setItem(LS, JSON.stringify(old)); return old; }
            return cur || {};
          } catch { return {}; }
        }

        async function post(path, data, auth) {
          const headers = { 'content-type': 'application/json' };
          if (auth !== false && S.token) headers.authorization = 'Bearer ' + S.token;
          const res = await fetch(BASE + '/' + path, { method: 'POST', headers, body: JSON.stringify({ data: data || {} }) });
          const body = await res.json().catch(() => null);
          if (!res.ok) {
            const msg = (body && body.error && body.error.message) || ('网络错误 ' + res.status);
            throw Object.assign(new Error(msg), { code: body && body.error && body.error.code });
          }
          return body && body.result;
        }

        async function login() {
          if (S.token) return;
          const r = await post('auth/anonymous', {}, false);
          S.token = r.idToken; S.refresh = r.refreshToken; S.uid = r.uid;
          save();
        }

        function ulid() {
          const B = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
          let t = Date.now(), s = '';
          for (let i = 9; i >= 0; i -= 1) { s = B[t % 32] + s; t = Math.floor(t / 32); }
          for (let i = 0; i < 16; i += 1) s += B[Math.floor(Math.random() * 32)];
          return s;
        }

        function pop() {
          el.pet.classList.remove('happy');
          void el.pet.offsetWidth;
          el.pet.classList.add('happy');
          el.petFx.classList.add('show');
          setTimeout(() => el.petFx.classList.remove('show'), 1200);
        }

        function render() {
          const paired = !!S.coupleId;
          el.viewPair.classList.toggle('hidden', paired);
          el.viewChat.classList.toggle('hidden', !paired);
          el.pill.textContent = paired ? '已连接' : '未连接';
          el.whoText.textContent = paired ? '和电脑上的方块仔连着' : '';
          el.petName.textContent = paired ? '它在你电脑上' : '方块仔';
          const hint = document.getElementById('apkHint');
          if (hint) hint.classList.toggle('hidden', paired);
          renderList();
        }

        function renderList() {
          if (!S.coupleId) return;
          if (!S.messages.length) {
            el.list.innerHTML = '<div class="empty">还没有悄悄话<br />说一句，电脑上的方块仔会替你念出来</div>';
            return;
          }
          const html = S.messages.map((m) => {
            const mine = m.from === S.uid;
            const t = new Date(m.ts || m.at || Date.now());
            const hh = String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');
            const text = (m.text || '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
            return '<div class="msg ' + (mine ? 'me' : 'they') + '">' + text + '<time>' + hh + '</time></div>';
          }).join('');
          el.list.innerHTML = html;
          el.list.scrollTop = el.list.scrollHeight;
        }

        async function syncMessages() {
          if (!S.coupleId) return;
          try {
            const r = await post('msgHistory', { limit: 100 });
            const list = ((r && r.messages) || []).filter((m) => m && m.type === 'note' && typeof m.text === 'string');
            const newest = list.length ? list[list.length - 1].id : '';
            if (newest && newest !== S.seen) {
              const isNewFromPartner = S.seen && list.some((m) => m.id > S.seen && m.from !== S.uid);
              S.seen = newest;
              S.messages = list;
              renderList();
              el.syncAt.textContent = '同步 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
              if (isNewFromPartner) pop();
            } else if (!S.messages.length) {
              S.messages = list;
              renderList();
            }
          } catch (err) {
            if (err.code === 'unauthenticated') { S.token = ''; save(); await login(); }
          }
        }

        async function refreshMe() {
          if (!S.token) return;
          try {
            const res = await fetch(BASE + '/auth/me', { headers: { authorization: 'Bearer ' + S.token } });
            const body = await res.json().catch(() => null);
            const me = body && body.result;
            if (me && me.coupleId && me.coupleId !== S.coupleId) {
              S.coupleId = me.coupleId;
              save();
              toast('配对成功！');
              pop();
              render();
              await syncMessages();
              startTimers();
            }
          } catch { /* ignore */ }
        }

        function startTimers() {
          clearInterval(S.msgTimer);
          clearInterval(S.meTimer);
          if (S.coupleId) {
            S.msgTimer = setInterval(syncMessages, 2000);
          } else {
            S.meTimer = setInterval(refreshMe, 3000);
          }
        }

        async function boot() {
          const saved = load();
          S.token = saved.token || ''; S.refresh = saved.refresh || ''; S.uid = saved.uid || ''; S.coupleId = saved.coupleId || '';
          render();
          try { await login(); } catch (err) { el.pill.textContent = '离线'; toast('连不上服务器，检查网络'); return; }
          await refreshMe();
          if (S.coupleId) await syncMessages();
          render();
          startTimers();
        }

        el.codeInput.addEventListener('input', () => {
          el.codeInput.value = el.codeInput.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
          el.joinBtn.disabled = el.codeInput.value.length !== 6;
        });
        el.codeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !el.joinBtn.disabled) el.joinBtn.click(); });

        el.joinBtn.addEventListener('click', async () => {
          if (S.busy) return;
          S.busy = true; el.joinBtn.disabled = true; el.joinBtn.textContent = '连接中…';
          try {
            await login();
            const r = await post('acceptInvite', { code: el.codeInput.value });
            S.coupleId = (r && r.coupleId) || '';
            save();
            toast('配对成功！');
            pop();
            render();
            await syncMessages();
            startTimers();
          } catch (err) {
            toast(err.message || '配对失败，检查邀请码');
          } finally {
            S.busy = false; el.joinBtn.disabled = false; el.joinBtn.textContent = '连接';
          }
        });

        el.createBtn.addEventListener('click', async () => {
          if (S.busy) return;
          S.busy = true; el.createBtn.disabled = true; el.createBtn.textContent = '生成中…';
          try {
            await login();
            const r = await post('createInvite', {});
            const code = (r && r.code) || '';
            el.bigcode.innerHTML = String(code).split('').map((c) => '<b>' + c + '</b>').join('');
            el.created.classList.remove('hidden');
            const min = Math.max(1, Math.round(((r.expiresAt || 0) - Date.now()) / 60000));
            el.expireText.textContent = min + ' 分钟内有效，在电脑上输入它';
            toast('邀请码已生成');
            startTimers();
          } catch (err) {
            toast(err.message || '生成失败');
          } finally {
            S.busy = false; el.createBtn.disabled = false; el.createBtn.textContent = '生成邀请码';
          }
        });

        async function send() {
          const text = el.msgInput.value.trim();
          if (!text || !S.coupleId) return;
          el.sendBtn.disabled = true;
          try {
            await post('msgPost', { id: ulid(), type: 'note', text });
            el.msgInput.value = '';
            await syncMessages();
          } catch (err) {
            toast(err.message || '发送失败');
          } finally { el.sendBtn.disabled = false; el.msgInput.focus(); }
        }
        document.getElementById('gestures').addEventListener('click', async function (e) {
          const btn = e.target.closest ? e.target.closest('button[data-act]') : null;
          if (!btn || !S.coupleId) return;
          const act = btn.getAttribute('data-act');
          const label = (btn.querySelector('span') || {}).textContent || '';
          btn.disabled = true;
          try {
            await post('interact', { action: act });
            if (navigator.vibrate) navigator.vibrate(22);
            pop();
            toast('已经' + label + '啦');
          } catch (err) {
            toast(err.message || '没发出去，检查网络');
          } finally {
            btn.disabled = false;
          }
        });        document.getElementById('unpairBtn').addEventListener('click', function () {
          if (!confirm('断开后会回到配对页，需要重新输入邀请码。继续？')) return;
          localStorage.removeItem('cubbit_mobile_v1');
          localStorage.removeItem('cubbit_mobile_v2');
          location.reload();
        });
        el.sendBtn.addEventListener('click', send);
        el.msgInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

        // 回到前台时立刻同步一次
        document.addEventListener('visibilitychange', () => { if (!document.hidden) { syncMessages(); refreshMe(); } });

        boot();
      })();
    </script>
  </body>
</html>
