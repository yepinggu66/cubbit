<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>方块仔 · 拍一只</title>
    <link rel="stylesheet" href="photo.css" />
  </head>
  <body>
    <div class="shell">
      <header class="bar">
        <div class="bar__left">
          <span class="bar__dot"></span>
          <div>
            <h1>拍一只</h1>
            <p>路边遇见的那只，拍下来，它就是你的桌宠了。</p>
          </div>
        </div>
        <div class="bar__right">
          <button class="btn btn--icon" id="closeBtn" type="button" aria-label="关闭">✕</button>
        </div>
      </header>

      <main class="body">
        <section class="pane pane--left">
          <div class="pane__head">
            <b>1 · 选一张照片</b>
            <span class="pane__hint" id="srcHint">目标居中、背景干净，抠得最干净。</span>
          </div>

          <div class="stage" id="stage">
            <canvas id="preview" width="420" height="420"></canvas>
            <div class="stage__empty" id="stageEmpty">
              <div class="stage__icon">📷</div>
              <p>选一张照片，或者现在拍一张</p>
            </div>
            <div class="stage__ring"></div>
          </div>

          <div class="pickers">
            <label class="btn btn--ghost" for="fileInput">📁 选照片</label>
            <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp" hidden />
            <button class="btn btn--ghost" id="cameraBtn" type="button">📸 拍一张</button>
            <div class="zoom">
              <span>缩放</span>
              <input id="zoom" type="range" min="100" max="320" value="100" />
            </div>
          </div>
          <p class="tip" id="dropTip">也可以把图片直接拖进这个窗口。</p>
        </section>

        <section class="pane pane--right">
          <div class="pane__head">
            <b>2 · 认一下</b>
            <span class="pane__hint">名字和性格会带进桌宠的日常。</span>
          </div>

          <label class="field">
            <span>它叫什么</span>
            <input id="name" type="text" maxlength="12" placeholder="路边捡到的" />
          </label>

          <div class="field field--chips">
            <span>性子</span>
            <div class="chips" id="tempChips"></div>
          </div>

          <button class="btn btn--primary btn--wide" id="forgeBtn" type="button" disabled>生成桌宠</button>
          <p class="tip" id="forgeTip">生成只在本机完成：抠底 → 对齐 12 只内置形象的比例 → 补边缘光。照片不会上传。</p>

          <div class="result" id="result" hidden>
            <div class="result__head">
              <b id="resultName">—</b>
              <span class="badge" id="resultMeta"></span>
            </div>
            <div class="result__frames">
              <figure>
                <img id="frameIdle" alt="睁眼" />
                <figcaption>睁眼</figcaption>
              </figure>
              <figure>
                <img id="frameBlink" alt="闭眼" />
                <figcaption id="blinkCap">闭眼</figcaption>
              </figure>
            </div>
            <div class="result__warn" id="resultWarn" hidden></div>
            <div class="result__acts">
              <button class="btn btn--primary" id="useBtn" type="button">就用这一只</button>
              <button class="btn btn--ghost" id="againBtn" type="button">再试一次</button>
            </div>
          </div>

          <div class="gallery" id="gallery"></div>
        </section>
      </main>

      <footer class="foot">
        <span id="footNote">照片只留在你自己的电脑里，不会传到任何服务器。</span>
        <span class="foot__right" id="countNote"></span>
      </footer>
    </div>
    <video id="video" playsinline hidden></video>
    <script src="../../shared/diy.js"></script>
    <script src="photo.js"></script>
  </body>
</html>
