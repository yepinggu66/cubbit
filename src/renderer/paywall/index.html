<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>方块仔 · 购买 / 激活</title>
    <link rel="stylesheet" href="../ui/ui.css" />
    <link rel="stylesheet" href="paywall.css" />
  </head>
  <body>
    <div id="titlebar-host"></div>
    <div class="pay">
      <main class="pay__main">
        <div class="pay__top">
          <div>
            <div class="pay__eyebrow">CUBBIT · 方块仔</div>
            <h1 class="pay__title" id="title"></h1>
            <p class="pay__sub" id="sub"></p>
          </div>
          <label class="pay__region">
            <span id="regionLabel"></span>
            <select id="regionSelect"></select>
          </label>
        </div>

        <div class="pay__plans" id="plans" role="radiogroup"></div>
        <div class="pay__charge" id="chargeNote"></div>

        <div class="pay__actions">
          <button class="btn btn--primary btn--lg" type="button" id="buyBtn"></button>
          <button class="btn btn--ghost" type="button" id="copyNoteBtn"></button>
        </div>

        <section class="pay__steps">
          <div class="pay__steps-title" id="stepsTitle"></div>
          <ol id="steps"></ol>
          <div class="pay__device">
            <span id="deviceLabel"></span>
            <code id="deviceId">—</code>
            <button class="btn btn--link" type="button" id="copyDeviceBtn"></button>
          </div>
        </section>

        <section class="pay__key" id="keySection">
          <div class="pay__steps-title" id="keyTitle"></div>
          <div class="pay__key-row">
            <input class="pay__input" id="keyInput" type="text" placeholder="CUBB-XXXX-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false" />
            <button class="btn btn--primary" type="button" id="activateBtn"></button>
          </div>
          <div class="pay__status" id="keyStatus"></div>
        </section>

        <div class="pay__license" id="licenseLine"></div>

        <div class="pay__foot">
          <div class="pay__links">
            <button class="btn btn--link" type="button" id="termsLink"></button>
            <button class="btn btn--link" type="button" id="privacyLink"></button>
            <button class="btn btn--link" type="button" id="refundLink"></button>
          </div>
          <div class="pay__links">
            <button class="btn btn--link" type="button" id="restoreBtn"></button>
            <button class="btn btn--link hidden" type="button" id="unbindBtn"></button>
          </div>
        </div>
      </main>
    </div>

    <script src="../ui/mock.js"></script>
    <script src="../../shared/i18n-dict.js"></script>
    <script src="../../shared/i18n.js"></script>
    <script src="../../shared/offer-config.js"></script>
    <script src="../../shared/pricing.js"></script>
    <script src="../../shared/lite-config.js"></script>
    <script src="../ui/ui.js"></script>
    <script src="paywall-i18n.js"></script>
    <script src="paywall.js"></script>
  </body>
</html>
